name: build-staging
on:
  pull_request:
    types: [labeled]
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

env:
  PRIMUS_HOME: .primus
  MAKE: make --no-print-directory --makefile=.primus/src/make/main.mk

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || startsWith(github.event.label.name, 'staging:') }}
    outputs:
      version: ${{ steps.build-info.outputs.version }}
      path: ${{ steps.build-info.outputs.path }}
    steps:
      - name: self-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: token
        name: github-token-gen
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.NP_PRIMUS_APP_ID }}
          private-key: ${{ secrets.NP_PRIMUS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: primus-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: signoz/primus
          ref: main
          path: .primus
          token: ${{ steps.token.outputs.token }}
      - name: build-info
        id: build-info
        env:
          LABEL: ${{ github.event.label.name }}
        run: |
          # merges to main release the base every overlay inherits, a staging:<deployment> label releases that overlay
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            path="overlays/staging/*/signoz/base"
          else
            # the deployment is spliced into the release path glob and the JSON payload
            deployment="${LABEL#staging:}"
            if [[ ! "${deployment}" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
              echo "::error::label ${LABEL} must be staging:<deployment>, where the deployment is lowercase letters, digits and dashes"
              exit 1
            fi
            path="overlays/staging/*/signoz/overlays/${deployment}"
          fi

          {
            echo "version=$($MAKE info-version)"
            echo "path=${path}"
          } >> "${GITHUB_OUTPUT}"
  signoz-otel-collector:
    uses: signoz/primus.workflows/.github/workflows/go-build.yaml@main
    secrets: inherit
    needs: prepare
    with:
      PRIMUS_REF: main
      GO_VERSION: 1.25
      GO_BUILD_CONTEXT: ./cmd/signozotelcollector
      GO_BUILD_FLAGS: ""
      DOCKER_BASE_IMAGES: '{"debian":"debian:bookworm-slim"}'
      DOCKER_DOCKERFILE_PATH: ./cmd/signozotelcollector/Dockerfile.multi-arch
      DOCKER_MANIFEST: true
      DOCKER_PROVIDERS: gcp
  staging:
    uses: signoz/primus.workflows/.github/workflows/github-trigger.yaml@main
    secrets: inherit
    needs: [prepare, signoz-otel-collector]
    with:
      PRIMUS_REF: main
      GITHUB_ENVIRONMENT: staging
      GITHUB_SILENT: true
      GITHUB_REPOSITORY_NAME: signoz.staging.cl.gcp.deployments
      GITHUB_EVENT_NAME: release
      # the clickhouse logs-system-exporter sidecar runs this image too but is pinned on its own, so only the
      # collector deployment and the telemetrystore migrator job are released
      GITHUB_EVENT_PAYLOAD: '{"path": "${{ needs.prepare.outputs.path }}", "image": "us-central1-docker.pkg.dev/signoz-registry/signoz-otel-collector/signoz-otel-collector", "tag": "${{ needs.prepare.outputs.version }}", "containers": "collector check ready bootstrap sync async"}'
