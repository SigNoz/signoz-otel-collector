exporters:
    debug: null
    nop: {}
    prometheus:
        endpoint: 0.0.0.0:8889
extensions:
    zpages: {}
processors:
    batch:
        send_batch_size: 10000
        timeout: 10s
receivers:
    nop: {}
    otlp:
        protocols:
            grpc: null
            http: null
service:
    extensions:
        - zpages
    pipelines:
        metrics:
            exporters:
                - nop
            processors:
                - batch
            receivers:
                - nop
        traces:
            exporters:
                - nop
            processors:
                - batch
            receivers:
                - nop
    telemetry:
        resource:
            service.instance.id: opamp/testdata/coll-config-path.yaml
