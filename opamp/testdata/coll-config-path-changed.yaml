exporters:
    debug: null
    prometheus:
        endpoint: 0.0.0.0:8889
extensions:
    zpages:
        endpoint: localhost:0
processors:
    batch:
        send_batch_size: 100000 # changed
        timeout: 10s
receivers:
    otlp:
        protocols:
            grpc:
                endpoint: localhost:0
            http:
                endpoint: localhost:0
service:
    extensions:
        - zpages
    pipelines:
        metrics:
            exporters:
                - debug
            processors:
                - batch
            receivers:
                - otlp
        traces:
            exporters:
                - logging
            processors:
                - batch
            receivers:
                - otlp
    telemetry:
        metrics:
            level: none
        resource:
            service.instance.id: opamp/testdata/coll-config-path.yaml
