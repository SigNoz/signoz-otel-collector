type: signozlogsinferrer
github_project: SigNoz/signoz-otel-collector

status:
  class: processor
  stability:
    alpha: [logs]

attributes:
  field:
    description: Configured field name the value was read from, or for a derived value the target it was derived from.
    type: string
  source:
    description: Where the value was found. derived is a severity half filled from the other half.
    type: string
    enum: [body, attributes, scope, resource, derived]
  target:
    description: Top level log record field inferred.
    type: string
    enum: [severity_number, severity_text, trace_id, span_id, scope_name, scope_version]

telemetry:
  metrics:
    signozlogsinferrer.field.inferences:
      enabled: true
      stability:
        level: alpha
      prefix: otelcol.
      description: Top level fields inferred, by target, the field read and where it was found.
      unit: "{field}"
      sum:
        value_type: int
        monotonic: true
        async: true
      attributes: [target, field, source]

    signozlogsinferrer.log.records:
      enabled: true
      stability:
        level: alpha
      prefix: otelcol.
      description: Log records processed.
      unit: "{record}"
      sum:
        value_type: int
        monotonic: true
        async: true

tests:
  skip_lifecycle: true
  skip_shutdown: true
