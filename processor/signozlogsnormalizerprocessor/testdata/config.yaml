signozlogsnormalizer:
signozlogsnormalizer/body_disabled:
  body:
    enabled: false
signozlogsnormalizer/body_fields:
  body:
    fields: [text]
signozlogsnormalizer/fields:
  severity_text:
    fields: [sev]
  scope_name:
    fields: [logger, scope.name]
signozlogsnormalizer/fields_copy:
  trace_id:
    move: false
signozlogsnormalizer/fields_empty:
  severity_text:
    fields: []
signozlogsnormalizer/unknown:
  body:
    unknown_key: true
signozlogsnormalizer/field_unknown:
  trace_id:
    unknown_key: true
signozlogsnormalizer/opamp_position_before:
  opamp:
    position: before
signozlogsnormalizer/bad_opamp_position:
  opamp:
    position: middle
