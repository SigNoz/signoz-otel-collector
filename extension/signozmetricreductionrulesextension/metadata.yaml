type: signozmetricreductionrules
github_project: SigNoz/signoz-otel-collector

status:
  class: extension
  stability:
    alpha: [extension]

attributes:
  error_type:
    name_override: error.type
    description: "Why the poll failed. timeout: the poll hit its timeout. other: any other error. Set only on failed polls."
    type: string
    enum: [timeout, other]

telemetry:
  metrics:
    signozmetricreductionrules.polls:
      enabled: true
      stability:
        level: alpha
      prefix: otelcol.
      description: Polls of the rules table. A failed poll has error.type and keeps the last loaded rules.
      unit: "{poll}"
      sum:
        value_type: int
        monotonic: true
      attributes: [error_type]

    signozmetricreductionrules.rule.count:
      enabled: true
      stability:
        level: alpha
      prefix: otelcol.
      description: Active reduction rules after the last successful poll.
      unit: "{rule}"
      gauge:
        value_type: int

tests:
  config:
    dsn: tcp://127.0.0.1:1
