type: clickhousetraces
status:
  class: exporter
  stability:
    stable: [traces]

tests:
  skip_lifecycle: true
  skip_shutdown: true
  goleak:
    ignore:
      top:
        - "go.opencensus.io/stats/view.(*worker).start"
        - "go.opencensus.io/metric/metricexport.(*IntervalReader).startInternal"
        - "github.com/jellydator/ttlcache/v3.(*Cache[...]).Start"
        - "github.com/ClickHouse/clickhouse-go/v2.(*clickhouse).startAutoCloseIdleConnections"
