metadataexporter:
  max_distinct_values:
    traces:
      max_keys: 100
      max_string_length: 128
      max_string_distinct_values: 420
      fetch_interval: 5m
    metrics:
      max_keys: 100
      max_string_length: 16
      max_string_distinct_values: 1024
      fetch_interval: 5m
    logs:
      max_keys: 100
      max_string_length: 64
      max_string_distinct_values: 512
      fetch_interval: 10m
  json:
    max_keys_at_level: 100
    enabled: true
metadataexporter/field_values:
  enabled: true
  cache:
    provider: redis
    redis:
      addr: localhost:6379
  field_values:
    enabled: true
    source: meter
    limits:
      max_record_field_values: 1000
    cache:
      provider: redis
      max_bytes: 536870912
    classification:
      refresh_interval: 5m
    always_include:
      - service.name
