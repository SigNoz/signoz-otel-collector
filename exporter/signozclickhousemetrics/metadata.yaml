type: signozclickhousemetrics

status:
  class: exporter
  stability:
    beta:
      - metrics
  distributions:
    - signoz

tests:
  config:
  skip_lifecycle: false
  skip_shutdown: false
  expect_consumer_error: true
  goleak:
    skip: false
    ignore:
      top:
        - go.opencensus.io/stats/view.(*worker).start
        - github.com/ClickHouse/clickhouse-go/v2.(*clickhouse).startAutoCloseIdleConnections
